<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="astroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0000FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="astroInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <style>
      .outer-star {
        stroke: url(#astroGrad);
        stroke-width: 5.5;
        fill: #FFFFFF;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 255, 0.25));
      }
      .inner-star {
        stroke: url(#astroGrad);
        stroke-width: 3.2;
        fill: url(#astroInner);
      }
      @media (prefers-color-scheme: dark) {
        .outer-star {
          stroke: #3B82F6;
          fill: #0B132B;
          filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.6));
        }
        .inner-star {
          stroke: #60A5FA;
          fill: #00D2FF;
        }
      }
    </style>
  </defs>

  <!-- Estrella Exterior Cóncava Oficial de Astro Bank -->
  <path
    class="outer-star"
    d="M50 4 Q50 50 96 50 Q50 50 50 96 Q50 50 4 50 Q50 50 50 4 Z"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Estrella Interior Concéntrica Oficial de Astro Bank -->
  <path
    class="inner-star"
    d="M50 25 Q50 50 75 50 Q50 50 50 75 Q50 50 25 50 Q50 50 50 25 Z"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
